[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaomi-nas-tool"
version = "0.1.0"
description = "Small, privacy-conscious tools for Xiaomi Smart Storage"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
xiaomi-nas-tool = "xiaomi_nas_tool.cli:main"

[tool.setuptools.packages.find]
include = ["xiaomi_nas_tool*"]
